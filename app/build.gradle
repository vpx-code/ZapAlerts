plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.6.21'
    id 'com.huawei.agconnect'
}

android {
    signingConfigs {
        debug {
            storeFile file('/Users/neochemical/Android/Keys/zapalerts.jks')
            storePassword '12345678'
            keyAlias 'zapalerts'
            keyPassword '12345678'
        }
        release {
            storeFile file('/Users/neochemical/Android/Keys/zapalerts.jks')
            storePassword '12345678'
            keyAlias 'zapalerts'
            keyPassword '12345678'
        }
    }
    compileSdk 32

    defaultConfig {
        applicationId "com.xvlaze.zapalerts"
        minSdk 28
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures{
        viewBinding = true
    }
    namespace 'com.xvlaze.zapalerts'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.5.1'
    implementation 'androidx.fragment:fragment-ktx:1.5.2'
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.5.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1"
    implementation 'com.huawei.agconnect:agconnect-core:1.6.4.300'
    implementation 'com.huawei.hms:searchkit:5.0.4.303'
    implementation 'com.huawei.agconnect:agconnect-cloud-database:1.5.3.300'
    implementation 'com.huawei.hms:hwid:6.4.0.301'
    implementation "com.huawei.agconnect:agconnect-auth-huawei:1.7.1.300"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.10"
}

apply plugin: 'com.huawei.agconnect'
apply plugin: 'kotlin-android'
repositories {
    mavenCentral()
}